<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Propriétés</title>
    <style>
    </style>
</head>
<body>

    <button id="logoutBtn">Logout</button>

    <h1>Liste des biens immobiliers</h1>

    <p id="message">Chargement des biens...</p>

    <div id="filters">

    <select id="sortDate">
        <option value="">Tri date</option>
        <option value="newest">Plus récent</option>
        <option value="oldest">Plus ancien</option>
    </select>

    <select id="sortPrice">
        <option value="">Tri prix</option>
        <option value="asc">Prix croissant</option>
        <option value="desc">Prix décroissant</option>
    </select>

    <select id="sortSurface">
        <option value="">Tri surface</option>
        <option value="asc">Surface croissante</option>
        <option value="desc">Surface décroissante</option>
    </select>

    <select id="cityFilter">
        <option value="">Toutes les villes</option>
    </select>

    <select id="typeFilter">
        <option value="">Tous types</option>
        <option value="residential">Résidentiel</option>
        <option value="professional">Professionnel</option>
    </select>

</div>

    <table id="propertiesTable" style="display: none;">
        <thead>
            <tr>
                <th>Title</th>
                <th>City</th>
                <th>Surface (m²)</th>
                <th>Adresse</th>
                <th>Prix (€)</th>
                <th>Type</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="propertiesContainer">
            </tbody>
    </table>

    <h2>Ajouter une propriété</h2>

    <form id="addPropertyForm">
        <input  type="text"   name="title"     placeholder="Titre"        required />
        <input  type="text"   name="city"      placeholder="Ville"        required />
        <input  type="number" name="surface"   placeholder="Surface (m²)" required />
        <input  type="text"   name="address"   placeholder="Adresse"      required />
        <input  type="number" name="prix"      placeholder="Prix (€)"     required />
        <input  type="number" name="agency_id" placeholder="ID Agence"    required />
        <input  type="number" name="agent_id"  placeholder="ID Agent"     required />

        <select name="type" required>
            <option value="">-- Type --</option>
            <option value="residential">Résidentiel</option>
            <option value="professional">Professionnel</option>
        </select>

        <select name="status">
            <option value="available">Disponible</option>
            <option value="sold">Vendu</option>
            <option value="pending">En attente</option>
        </select>

        <button type="submit">Ajouter</button>
        <p id="formMessage"></p>
    </form>

    <script type="module" src="../scripts/properties.js"></script>
    <script type="module" src="../scripts/common.js">
    </script>
</body>
</html>
